- name: this is loops
  hosts: localhost
  connection: local
  become: yes
  tasks:
  - name: to print loops
    debug:
      msg: "To print loops {{item}}"
    loop:
     - linix
     - shell
     - Ansible 
  - name: to install
    package:
      name: "{{item}}"
      state: present
    loop:
     - git
     - nginx
     - zip 
  - name: to install and Remove
    package:
      name: "{{item.name}}"
      state: "{{item.state}}"
    loop:
     - {name: "nginx", state: "absent"}
     - {name: "zip", state: "absent"}
     - {name: "mysql", state: "present"}


