- name: To create ec2 instances and D53 DNS in AWS
  hosts: local
  connection: local
  vars:
   instances: ["mongodb", "reddis"]
   image_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
     instance_type: t3.micro
     name: "roboshop-{{item}}"
     image_id: "{{image_id}}"
     security_groups: # if multiple use security_groups, otherwise 1 use for security group
     - "robo-{{item}}"
    loop: "{{instances}}"
    register: ec2_output  # to capture module output

  - name: Print Output
    debug:
      msg: Tp Print "{{ec2_output | json}}"