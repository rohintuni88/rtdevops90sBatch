- name: Install nginx
  hosts: frontend
  become: yes
  tasks:
    - name: Install nginx
      ansible.builtin.package:
        name: nginx
        state: present 
  
    - name: start nginx
      service:
        name: nginx
        state: started
        enabled: yes 

    - name: check status of nginx
      service:
        name: nginx
        state: started
    
    - name: check ports
      command: netstat -lntp
      register: netstat_output

    - name: print lntp output
      debug:
        var: netstat_output.stdout_lines
        msg: netstat_output.stdout_lines



