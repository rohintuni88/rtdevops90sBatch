- name: varibales
  hosts: localhost
  connection: local
  become: yes
  vars_files:
    # name: "DevOps"    # play level variable
    # age: 25
  - course_vars.yaml
  vars:
    place: khammam
  vars_prompt:
  - name: username
    prompt: "Please enter UN"
    private: false
  - name: password
    prompt: "enter password"
    private: true
  tasks:
  - name: print some text
    vars:
     name: "DevOps with AIOps"   # Task level variable
     age: 40
    debug:
     msg: "Hi {{name}}, and I am {{age}} from {{place}}"
  - name: To install nginx
    package:
      name: "{{software}}"
      state: present
  - name: prompt enter
    debug:
      msg: "please enter {{username}} and {{password}}"
   